  wan_url:
    wan_url: null
llm_gateway:
  port: '8000'
  server_ip: 192.168.0.XXX
  server_mac: aa:aa:aa:aa:aa:aa
  wakeup_port: 9999

llm_models:
    creative: qwen2.5:32b-instruct-q4_K_M
    mcp: qwen2.5:32b-instruct-q4_K_M

home_assistant:
  ha_token: ha_token
  ha_hostname: 192.168.0.YYY
  ha_weather_location: weather.paris

ratp:
  token: token
  location:
    workplace: "48.875248, 2.326012"
    home: "48.844325, 2.374381"
  commute:
    work:
      desc: DOCSTRING
      from: "home"
      to: "workplace"
      mandatory_line:
        - "5153"
  departure:
    daily:
      dest_desc: "Get upcoming public transport departure times for the morning commute (Going to work/destination). Returns real-time schedules for Line 10 and Line 13."
      dest:
        - name: "10"
          direction: 'Pont de Saint-Cloud'
          stop: "21970"
          id_name: "C01380"
          walk: 5
        - name: "13"
          direction: 'Saint-Denis-Université'
          stop: "22229"
          id_name: "C01383"
          walk: 5
      ret_desc: "Get upcoming public transport departure times for the evening commute (Returning home). Returns real-time schedules for Line 9."
      ret:
        - name: "9"
          direction: 'Montreuil'
          stop: "462914"
          id_name: "C01379"
          walk: 5
    daily_2:
      dest_desc: DOCSTRING
      dest:
        - name: "10"
          direction: 'Pont de Saint-Cloud'
          stop: "21970"
          id_name: "C01380"
          walk: 5
        - name: "13"
          direction: 'Saint-Denis-Université'
          stop: "22229"
          id_name: "C01383"
          walk: 5
      ret_desc: DOCSTRING
      ret:
        - name: "9"
          direction: 'Montreuil'
          stop: "462914"
          id_name: "C01379"
          walk: 5
